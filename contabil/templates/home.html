{% include 'partials/head.html' %}
<body>
    {% include 'partials/header.html' %}
    <main>
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %} {% endblock %}
    </main>
    <footer>
        Finanças Família M&M - Método das partidas dobradas &copy; {% now "Y" %}
    </footer>
</body>
</html>
